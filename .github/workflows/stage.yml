name: Promote stage

# Reusable stage used by pipeline.yml. For one head → base promotion it:
#   1. opens (or reuses) the pull request
#   2. runs commit lint, format, lint, typecheck and build
#   3. posts an automated review (Claude, when a key is configured) after checks, leading with any failure
#   4. posts/updates a CI report comment
#   5. merges with a merge commit (never squash) when every check passed.
#      A feature branch more than one commit ahead of dev is not merged.
on:
  workflow_call:
    inputs:
      head:
        type: string
        required: true
      base:
        type: string
        required: true
      kind:
        description: "feature (branch → dev) or release (dev → main)"
        type: string
        required: true
      delete_branch:
        type: boolean
        default: false
      auto_merge:
        type: boolean
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
    outputs:
      merged:
        description: "true when the PR was merged by this run"
        value: ${{ jobs.merge.outputs.merged }}
      pr:
        value: ${{ jobs.prepare.outputs.pr }}

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  # Merge and report jobs have no checkout. gh otherwise errors with "not a git repository".
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Open pull request
    runs-on: ubuntu-latest
    concurrency:
      group: promote-${{ inputs.head }}-to-${{ inputs.base }}
      cancel-in-progress: false
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.range.outputs.sha }}
      skip: ${{ steps.range.outputs.skip }}
      one_commit: ${{ steps.range.outputs.one_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compare branches
        id: range
        run: |
          git fetch --quiet origin "${{ inputs.base }}"
          if ! git fetch --quiet origin "${{ inputs.head }}"; then
            merged=$(gh pr list --head "${{ inputs.head }}" --base "${{ inputs.base }}" --state merged --json number --jq '.[0].number // empty')
            if [ -n "$merged" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "one_commit=true" >> "$GITHUB_OUTPUT"
              echo "::notice::PR #$merged (${{ inputs.head }} → ${{ inputs.base }}) is already merged — nothing to promote."
              exit 0
            fi
            echo "::error::Could not fetch ${{ inputs.head }}."
            exit 1
          fi
          ahead=$(git rev-list --count "origin/${{ inputs.base }}..origin/${{ inputs.head }}")
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "origin/${{ inputs.head }}")" >> "$GITHUB_OUTPUT"
          if [ "$ahead" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "one_commit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ inputs.head }} has no commits that ${{ inputs.base }} doesn't already have — nothing to promote."
          elif [ "${{ inputs.kind }}" = "feature" ] && [ "$ahead" -gt 1 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "one_commit=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ inputs.head }} is $ahead commits ahead of ${{ inputs.base }}. Each commit needs its own branch; this pull request will not be merged."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "one_commit=true" >> "$GITHUB_OUTPUT"
            echo "${{ inputs.head }} is $ahead commit(s) ahead of ${{ inputs.base }}"
          fi
      - name: Find or create pull request
        id: pr
        if: steps.range.outputs.skip == 'false'
        run: |
          head="${{ inputs.head }}"; base="${{ inputs.base }}"
          pr=$(gh pr list --head "$head" --base "$base" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            # Release PRs stay a promote line plus the commit list.
            # Feature PRs use .github/pull_request_template.md, filled from one commit.
            if [ "${{ inputs.kind }}" = "release" ]; then
              title="release: promote dev to main ($(date -u +%Y-%m-%d))"
              commits=$(git log --no-merges --reverse --format='- %s (%h)' "origin/$base..origin/$head")
              body=$(printf '%s\n\n### Commits\n%s\n\n---\n_Opened automatically by the delivery pipeline. It merges with a merge commit (no squash) once all checks pass._' \
                "Promotes \`$head\` into \`$base\`." "$commits")
            else
              sha=$(git log --no-merges --format=%H "origin/$base..origin/$head" | tail -1)
              if [ -n "$sha" ]; then
                subject=$(git log -1 --format=%s "$sha")
                details=$(git log -1 --format=%b "$sha")
              else
                subject=""
                details=""
              fi
              [ -z "$subject" ] && subject="$head"
              title="$subject"
              if [ -n "$(printf '%s' "$details" | tr -d '[:space:]')" ]; then
                why=$(printf '%s\n\n%s' "$subject" "$details")
              else
                why="$subject"
              fi
              prefix=$(printf '%s\n' "$subject" | sed -n 's/^\([a-z][a-z]*\).*/\1/p')
              feat=" "; fix=" "; docs=" "; build=" "
              case "$prefix" in
                feat) feat=x ;;
                fix) fix=x ;;
                docs|style|refactor|perf|test) docs=x ;;
                build|ci|chore) build=x ;;
              esac
              body=$(printf '%s\n' \
                "## What & why" \
                "" \
                "$why" \
                "" \
                "## Type" \
                "" \
                "- [${feat}] feat" \
                "- [${fix}] fix" \
                "- [${docs}] docs / style / refactor / perf / test" \
                "- [${build}] build / ci / chore" \
                "" \
                "## Checklist" \
                "" \
                "- [ ] Commits follow Conventional Commits (\`type(scope): subject\`)" \
                "- [ ] \`npm run lint && npm run typecheck && npm run build\` pass locally" \
                "- [ ] Checked pages on mobile and desktop" \
                "- [ ] Copy/claims reviewed (no unverified stats, testimonials or partner claims)")
            fi
            if ! out=$(gh pr create --head "$head" --base "$base" --title "$title" --body "$body" 2>&1); then
              echo "$out"
              if echo "$out" | grep -qi "not permitted to create"; then
                echo "::error title=Repository setting needed::Enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests' (and 'Read and write permissions')."
              fi
              exit 1
            fi
            pr=$(gh pr list --head "$head" --base "$base" --state open --json number --jq '.[0].number')
            echo "Opened PR #$pr"
          else
            echo "Using existing PR #$pr"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
      - name: Require one commit per branch
        if: steps.range.outputs.one_commit == 'false'
        env:
          PR: ${{ steps.pr.outputs.pr }}
          AHEAD: ${{ steps.range.outputs.ahead }}
        run: |
          marker='<!-- credexus-one-commit -->'
          body=$(printf '%s\n### One commit per branch\n\nEach commit needs its own branch. `%s` is %s commits ahead of `%s`. The pipeline only merges a `feat/` or `fix/` branch that adds a single commit, so this pull request will not be merged. Open a new branch from the latest `%s` for each commit.\n' \
            "$marker" "${{ inputs.head }}" "$AHEAD" "${{ inputs.base }}" "${{ inputs.base }}")
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq "[.[] | select(.body | contains(\"$marker\"))][0].id // empty")
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --raw-field body="$body" >/dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  checks:
    name: Lint, typecheck & build
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.commits.outcome }}
      format: ${{ steps.format.outcome }}
      lint: ${{ steps.lint.outcome }}
      typecheck: ${{ steps.typecheck.outcome }}
      build: ${{ steps.build.outcome }}
      size: ${{ steps.size.outputs.table }}
      commits_excerpt: ${{ steps.commits.outputs.excerpt }}
      format_excerpt: ${{ steps.format.outputs.excerpt }}
      lint_excerpt: ${{ steps.lint.outputs.excerpt }}
      typecheck_excerpt: ${{ steps.typecheck.outputs.excerpt }}
      build_excerpt: ${{ steps.build.outputs.excerpt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Records the command's exit status (via the step outcome) and keeps about the last 40 lines.
      # The report quotes a failure; this job never commits or pushes a repair.
      - name: Check output helper
        run: |
          cat > "$RUNNER_TEMP/capture-check.sh" << 'EOF'
          #!/bin/bash
          set -uo pipefail
          log="$1"
          shift
          set +e
          "$@" >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          excerpt=$(tail -n 40 "$log" | tr -d '\r' | sed '/^CREDEXUS_EXCERPT_END$/d')
          if [ "${#excerpt}" -gt 8000 ]; then
            excerpt=${excerpt: -8000}
          fi
          {
            echo 'excerpt<<CREDEXUS_EXCERPT_END'
            printf '%s\n' "$excerpt"
            echo 'CREDEXUS_EXCERPT_END'
          } >> "$GITHUB_OUTPUT"
          exit "$status"
          EOF
      - name: Conventional commits
        id: commits
        if: inputs.kind == 'feature'
        continue-on-error: true
        run: |
          git fetch --quiet origin "${{ inputs.base }}"
          bash "$RUNNER_TEMP/capture-check.sh" /tmp/commits.log \
            npx commitlint --from "origin/${{ inputs.base }}" --to HEAD --verbose
      - name: Format
        id: format
        continue-on-error: true
        run: bash "$RUNNER_TEMP/capture-check.sh" /tmp/format.log npm run format:check
      - name: Lint
        id: lint
        continue-on-error: true
        run: bash "$RUNNER_TEMP/capture-check.sh" /tmp/lint.log npm run lint
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bash "$RUNNER_TEMP/capture-check.sh" /tmp/typecheck.log npm run typecheck
      - name: Build
        id: build
        continue-on-error: true
        run: bash "$RUNNER_TEMP/capture-check.sh" /tmp/build.log npm run build
      - name: Bundle size
        id: size
        if: steps.build.outcome == 'success'
        run: |
          {
            echo 'table<<EOF'
            echo '| Asset | Size (gzip) |'
            echo '| --- | ---: |'
            for f in $(ls -S build/client/assets/*.js build/client/assets/*.css | head -6); do
              printf '| `%s` | %s KB |\n' "$(basename "$f")" "$(gzip -c "$f" | wc -c | awk '{printf "%.1f", $1/1024}')"
            done
            echo "| **All JS** | **$(cat build/client/assets/*.js | gzip -c | wc -c | awk '{printf "%.1f", $1/1024}') KB** |"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Fail if any check failed
        if: >-
          steps.commits.outcome == 'failure' || steps.format.outcome == 'failure' ||
          steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: |
          echo "::error::One or more checks failed — see the CI report comment on the pull request."
          exit 1

  review:
    name: Automated review
    needs: [prepare, checks]
    # Checks stay the merge gate. Run after them even when they fail, so the prompt can quote the failure.
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' &&
      (needs.checks.result == 'success' || needs.checks.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR: ${{ needs.prepare.outputs.pr }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      COMMITS: ${{ needs.checks.outputs.commits }}
      FORMAT: ${{ needs.checks.outputs.format }}
      LINT: ${{ needs.checks.outputs.lint }}
      TYPECHECK: ${{ needs.checks.outputs.typecheck }}
      BUILD: ${{ needs.checks.outputs.build }}
      COMMITS_EXCERPT: ${{ needs.checks.outputs.commits_excerpt }}
      FORMAT_EXCERPT: ${{ needs.checks.outputs.format_excerpt }}
      LINT_EXCERPT: ${{ needs.checks.outputs.lint_excerpt }}
      TYPECHECK_EXCERPT: ${{ needs.checks.outputs.typecheck_excerpt }}
      BUILD_EXCERPT: ${{ needs.checks.outputs.build_excerpt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Explain how to enable AI review
        if: env.ANTHROPIC_API_KEY == '' && env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: |
          marker='<!-- credexus-ai-review-setup -->'
          if ! gh pr view "$PR" --json comments --jq '.comments[].body' | grep -q "$marker"; then
            gh pr comment "$PR" --body "$marker
          ### 🤖 AI review is not enabled yet

          Add **one** repository secret (Settings → Secrets and variables → Actions) to get Claude review comments on every pipeline PR:

          | Secret | How to get it |
          | --- | --- |
          | \`ANTHROPIC_API_KEY\` | console.anthropic.com → API keys (pay-as-you-go) |
          | \`CLAUDE_CODE_OAUTH_TOKEN\` | run \`claude setup-token\` locally (uses your Claude Pro/Max plan) |"
          fi
          echo "::warning::AI review skipped — set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN."
      - name: Claude code review
        if: env.ANTHROPIC_API_KEY != '' || env.CLAUDE_CODE_OAUTH_TOKEN != ''
        # A review problem should never block delivery; checks gate the merge.
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code@2 >/dev/null 2>&1
          prompt_file=$(mktemp)
          cat > "$prompt_file" << EOF
          You are reviewing pull request #${PR} in ${GITHUB_REPOSITORY} (${{ inputs.head }} → ${{ inputs.base }}).
          The PR branch is checked out in the current directory. Use \`gh pr diff ${PR}\` and \`gh pr view ${PR}\` to inspect it.

          Lead with the failed check. If any CI check failed, open the review by naming each failed check and quoting its output excerpt before any other finding. If every check passed, start with the verdict.

          Project: Credexus marketing site — React Router v7 SSR, Tailwind v4, shadcn/Magic UI, Framer Motion, Vercel.
          Review for: correctness and bugs; accessibility; SEO (meta, canonical, structured data, sitemap);
          performance regressions (bundle size, render-blocking work, hydration mismatches); security of form
          handling and file uploads; unverifiable marketing claims (stats, testimonials, partner/affiliation wording).

          Post your review with: gh pr review ${PR} --comment --body "<review>"
          Start the body with '### 🤖 Claude review'. Be concise: a short verdict, then a bulleted list of
          concrete findings with file:line references, ordered by severity. If there is nothing worth changing, say so.

          CI check results and output excerpts follow.
          EOF
          append_check() {
            printf '\n### %s (%s)\n' "$1" "$2"
            if [ -n "$3" ]; then
              printf '%s\n' "$3"
            fi
          }
          {
            append_check "Conventional commits" "$COMMITS" "$COMMITS_EXCERPT"
            append_check "Formatting (Prettier)" "$FORMAT" "$FORMAT_EXCERPT"
            append_check "Lint (ESLint)" "$LINT" "$LINT_EXCERPT"
            append_check "Typecheck" "$TYPECHECK" "$TYPECHECK_EXCERPT"
            append_check "Production build" "$BUILD" "$BUILD_EXCERPT"
          } >> "$prompt_file"
          timeout 15m claude -p "$(cat "$prompt_file")" \
            --allowedTools "Bash(gh pr diff:*)" "Bash(gh pr view:*)" "Bash(gh pr review:*)" "Bash(gh pr comment:*)" Read Grep Glob

  report:
    name: CI report comment
    needs: [prepare, checks]
    if: always() && needs.prepare.outputs.skip == 'false' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          PR: ${{ needs.prepare.outputs.pr }}
          SHA: ${{ needs.prepare.outputs.sha }}
          KIND: ${{ inputs.kind }}
          COMMITS: ${{ needs.checks.outputs.commits }}
          FORMAT: ${{ needs.checks.outputs.format }}
          LINT: ${{ needs.checks.outputs.lint }}
          TYPECHECK: ${{ needs.checks.outputs.typecheck }}
          BUILD: ${{ needs.checks.outputs.build }}
          COMMITS_EXCERPT: ${{ needs.checks.outputs.commits_excerpt }}
          FORMAT_EXCERPT: ${{ needs.checks.outputs.format_excerpt }}
          LINT_EXCERPT: ${{ needs.checks.outputs.lint_excerpt }}
          TYPECHECK_EXCERPT: ${{ needs.checks.outputs.typecheck_excerpt }}
          BUILD_EXCERPT: ${{ needs.checks.outputs.build_excerpt }}
          SIZE_TABLE: ${{ needs.checks.outputs.size }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
          ONE_COMMIT: ${{ needs.prepare.outputs.one_commit }}
        with:
          script: |
            const env = process.env;
            const marker = "<!-- credexus-ci-report -->";
            const icon = (o) => (o === "success" ? "✅" : !o || o === "skipped" ? "⏭️" : "❌");
            const rows = [
              ["Conventional commits", env.COMMITS, "npx commitlint --from origin/dev", env.COMMITS_EXCERPT],
              ["Formatting (Prettier)", env.FORMAT, "npm run format", env.FORMAT_EXCERPT],
              ["Lint (ESLint)", env.LINT, "npm run lint", env.LINT_EXCERPT],
              ["Typecheck", env.TYPECHECK, "npm run typecheck", env.TYPECHECK_EXCERPT],
              ["Production build", env.BUILD, "npm run build", env.BUILD_EXCERPT],
            ];
            const oneCommit = env.ONE_COMMIT !== "false";
            const commitsFailed = env.COMMITS === "failure";
            const failed = rows.some(([, o]) => o === "failure") || !env.BUILD;
            const next = commitsFailed
              ? "Open a new `fix/` or `feat/` branch from the latest `dev`, with one commit whose subject has no trailing period. Do not add a commit to the failing branch."
              : !oneCommit
                ? "Each commit needs its own branch. This branch is more than one commit ahead of the base, so the pipeline will not merge it."
                : failed
                  ? "Fix the failing checks and push again — the pipeline re-runs automatically."
                  : env.AUTO_MERGE === "true"
                    ? `All checks passed — merging with a merge commit${env.KIND === "feature" ? ", then promoting `dev` → `main`" : " and deploying to production"}.`
                    : "All checks passed — ready for manual review and merge (auto-merge is off).";
            const lines = [];
            let tableOpen = false;
            for (const [name, outcome, cmd, excerpt] of rows) {
              if (!tableOpen) {
                lines.push("| Check | Result | Fix locally |", "| --- | :---: | --- |");
                tableOpen = true;
              }
              lines.push(`| ${name} | ${icon(outcome)} | \`${cmd}\` |`);
              if (outcome === "failure") {
                const bodyText = String(excerpt || "").replace(/\r\n/g, "\n").replace(/<\/details>/gi, "<\\/details>").trim();
                const tickRun = (bodyText.match(/`+/g) || []).reduce((max, run) => Math.max(max, run.length), 0);
                const fence = "`".repeat(Math.max(3, tickRun + 1));
                lines.push(
                  "",
                  "<details>",
                  `<summary>${name} output</summary>`,
                  "",
                  fence,
                  bodyText || "_No output captured._",
                  fence,
                  "</details>",
                  "",
                );
                tableOpen = false;
              }
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### ${failed ? "❌ CI checks failed" : "✅ CI checks passed"}`,
              "",
              lines.join("\n"),
              "",
              env.SIZE_TABLE ? `<details><summary>Client bundle</summary>\n\n${env.SIZE_TABLE}\n</details>\n` : "",
              `**Next:** ${next}`,
              "",
              `Commit \`${env.SHA.slice(0, 7)}\` · [pipeline run](${runUrl})`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = Number(env.PR);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  merge:
    name: Merge (no squash)
    needs: [prepare, checks, review, report]
    if: >-
      always() && inputs.auto_merge && needs.prepare.outputs.skip == 'false' &&
      needs.prepare.outputs.one_commit == 'true' &&
      needs.checks.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: merge-into-${{ inputs.base }}
      cancel-in-progress: false
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Merge pull request
        id: merge
        env:
          PR: ${{ needs.prepare.outputs.pr }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" = "MERGED" ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR is already merged — nothing to do."
            exit 0
          fi
          args=(--merge --match-head-commit "$SHA" --repo "$GITHUB_REPOSITORY")
          ${{ inputs.delete_branch }} && args+=(--delete-branch)
          gh pr merge "$PR" "${args[@]}"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Merged PR #$PR (${{ inputs.head }} → ${{ inputs.base }}) with a merge commit."
