name: Deploy to Vercel (production)

# Production deploy of main. Called by the pipeline after it merges dev → main, and also runs
# when someone merges into main by hand or dispatches it manually.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Check, build & deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Vercel not configured::Missing repository secrets:$missing. Run 'npx vercel link' locally, copy orgId and projectId from .vercel/project.json, create a token at vercel.com/account/tokens, and add all three under Settings → Secrets and variables → Actions."
            exit 1
          fi
      # Always deploy the tip of main (when called from the pipeline, github.sha is the feature commit).
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pull Vercel environment
        run: npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy
        id: deploy
        run: echo "url=$(npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")" >> "$GITHUB_OUTPUT"
