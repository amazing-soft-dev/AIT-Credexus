name: Pipeline

# Delivery pipeline — the whole branching workflow, automated:
#
#   push feat/** or fix/** ──► PR feature → dev ──► checks + review ──► merge (merge commit)
#                                                                          │
#                              PR dev → main ◄─────────────────────────────┘
#                                   │
#                              checks + review ──► merge (merge commit)
#                                          │
#                              delete the feature branch ◄─────────────────┘
#
# A merge made with GITHUB_TOKEN does not start a new workflow, so dev → main
# runs in this same workflow after the feature pull request merges.
# Pushing to dev directly (or merging a PR into dev by hand) starts at the release stage.
# A pull request you open by hand is picked up by the push of its branch; the stage reuses it.
# There is no pull_request trigger. The PRs this workflow opens with GITHUB_TOKEN started a
# second run as github-actions[bot] that failed before any job ran, leaving a red check on every PR.
# The feature branch is deleted only after the release stage finishes. Deleting it
# earlier cancels this run before dev → main can start.
# Repository settings required: see "GitHub configuration" in README.md.
on:
  push:
    branches: ["feat/**", "fix/**", "dev"]
  # Manual re-run: pick a feat/fix branch (feature stage) or dev (release stage).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# One group per branch. A push and a manual re-run for that branch must not
# merge the same pull request twice. The later run no-ops when that pull
# request is already merged.
concurrency:
  group: pipeline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  feature:
    name: Feature → dev
    # Push or dispatch of feat/** or fix/**.
    if: github.ref_name != 'dev' && github.ref_name != 'main'
    uses: ./.github/workflows/stage.yml
    with:
      head: ${{ github.ref_name }}
      base: dev
      kind: feature
      delete_branch: false
      auto_merge: true
    secrets: inherit

  release:
    name: Dev → main
    needs: feature
    # After a feature merge in this same run, or when this run is on dev itself.
    # A GITHUB_TOKEN merge does not start a new workflow, so this cannot wait for a push to dev.
    if: >-
      always() && (
        needs.feature.outputs.merged == 'true' ||
        (needs.feature.result == 'skipped' && github.ref_name == 'dev')
      )
    uses: ./.github/workflows/stage.yml
    with:
      head: dev
      base: main
      kind: release
      delete_branch: false
      # Set repository variable AUTO_MERGE_TO_MAIN=false to stop at an open, reviewed PR.
      auto_merge: ${{ vars.AUTO_MERGE_TO_MAIN != 'false' }}
    secrets: inherit

  cleanup:
    name: Delete feature branch
    needs: [feature, release]
    # Deleting the head ref cancels this run. Wait until release has finished
    # so GitHub does not cancel dev → main.
    if: >-
      always() &&
      needs.feature.outputs.merged == 'true' &&
      (needs.release.result == 'success' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.ref_name }}
        run: |
          case "$HEAD" in
            feat/*|fix/*) ;;
            *)
              echo "Leaving '$HEAD' in place."
              exit 0
              ;;
          esac
          if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD}"; then
            echo "Deleted $HEAD after the release stage finished."
          else
            echo "::warning::Could not delete $HEAD. It may already be gone."
          fi
